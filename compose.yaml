services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -d postgres -Atqc \"SELECT to_regclass('public.activity_logs') IS NOT NULL\" | grep -q t"]
      interval: 5s
      retries: 20

  auth:
    image: supabase/gotrue:v2.170.0
    profiles: ["local-auth"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:3000
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:postgres@db:5432/postgres
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: http://localhost:3000
      GOTRUE_JWT_SECRET: ${CASEWISE_JWT_SECRET:-casewise-local-development-secret-change-for-production-2026}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_LOG_LEVEL: info
    ports:
      - "9999:9999"

  qdrant:
    image: qdrant/qdrant:v1.12.6
    profiles: ["local-qdrant"]
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"

  ollama:
    image: ollama/ollama:0.5.7
    profiles: ["local-llm"]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  ollama-init:
    image: ollama/ollama:0.5.7
    profiles: ["local-llm"]
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
    entrypoint: ["/bin/sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull \"$$OLLAMA_MODEL\""]
    restart: "no"

  ai:
    build: ./services/ai
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://casewise_api:casewise_api@db:5432/postgres
      SUPABASE_DB_URL: ${CASEWISE_ACTIVE_DB_URL:-}
      AUTH_URL: ${SUPABASE_URL:-http://auth:9999}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_JWKS_B64: ${SUPABASE_JWKS_B64:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-case-documents}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_ANSWER_MODEL: ${GEMINI_ANSWER_MODEL:-gemini-2.5-flash}
      GEMINI_ANALYSIS_MODEL: ${GEMINI_ANALYSIS_MODEL:-gemini-2.5-flash}
      DOCUMENT_DIR: /data/documents
    volumes:
      - documents_data:/data/documents
      - model_cache:/root/.cache/huggingface
    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
      args:
        SUPABASE_URL: ${SUPABASE_URL:-http://auth:9999}
        SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
    depends_on:
      - ai
    environment:
      AI_SERVICE_URL: http://ai:8000
      SUPABASE_URL: ${SUPABASE_URL:-http://auth:9999}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"

  migrate:
    image: postgres:16-alpine
    profiles: ["hosted-db"]
    environment:
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-}
      PGSSLMODE: require
      PGCONNECT_TIMEOUT: 10
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./supabase/apply-hosted-migration.sh:/apply-hosted-migration.sh:ro
    entrypoint: ["/bin/sh", "/apply-hosted-migration.sh"]

  mcp:
    build: ./services/mcp
    depends_on:
      - ai
    environment:
      AI_SERVICE_URL: http://ai:8000
    profiles: ["mcp"]

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
  documents_data:
  model_cache:
